<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz On Tap - Quan Ly Du An</title>
  <meta name="description" content="On tap trac nghiem mon Quan Ly Du An - 131 cau hoi 7 phan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #3b6fd4;
      --primary-dark: #2d57b0;
      --primary-light: #eef2fd;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --n100: #f1f5f9;
      --n200: #e2e8f0;
      --n300: #cbd5e1;
      --n400: #94a3b8;
      --n500: #64748b;
      --n600: #475569;
      --n700: #334155;
      --n800: #1e293b;
      --sw: 260px;
      --rad: 10px;
      --sh: 0 1px 4px rgba(0, 0, 0, .08), 0 4px 16px rgba(0, 0, 0, .06);
      --sh2: 0 1px 3px rgba(0, 0, 0, .08);
      --tr: .18s ease;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--n100);
      color: var(--n800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--n200);
      padding: 0 1.25rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--sh2);
    }

    .hl {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .htitle {
      font-weight: 700;
      font-size: 1rem;
    }

    .hsub {
      font-size: .75rem;
      color: var(--n500);
    }

    .hprog {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8rem;
      color: var(--n500);
      font-weight: 500;
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--n200);
      transition: var(--tr);
    }

    .dot.done {
      background: var(--success);
    }

    .dot.active {
      background: var(--primary);
    }

    .mnu {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      color: var(--n600);
      font-size: 1.25rem;
    }

    .ab {
      display: flex;
      flex: 1;
    }

    .sb {
      width: var(--sw);
      background: #fff;
      border-right: 1px solid var(--n200);
      padding: 1rem .75rem;
      flex-shrink: 0;
      overflow-y: auto;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
    }

    .slbl {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--n400);
      padding: 0 .5rem .5rem;
    }

    .plist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pb {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      padding: .6rem .75rem;
      display: flex;
      align-items: center;
      gap: .65rem;
      border-radius: 8px;
      transition: background var(--tr);
      font-family: inherit;
      font-size: .875rem;
      color: var(--n700);
    }

    .pb:hover:not(:disabled) {
      background: var(--n100);
    }

    .pb.act {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .pb:disabled {
      cursor: not-allowed;
      color: var(--n400);
    }

    .pico {
      font-size: 1rem;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    .pinfo {
      flex: 1;
      min-width: 0;
    }

    .pname {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prng {
      font-size: .72rem;
      color: var(--n400);
      margin-top: 1px;
    }

    .pb.act .prng {
      color: var(--primary);
      opacity: .7;
    }

    .mprog {
      height: 3px;
      background: var(--n200);
      border-radius: 99px;
      margin: 2px .75rem 4px;
    }

    .mbar {
      height: 100%;
      border-radius: 99px;
      background: var(--primary);
      transition: width .3s ease;
    }

    .sbo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      z-index: 90;
    }

    main {
      flex: 1;
      padding: 1.5rem 1.25rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .ph {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;
    }

    .ph h2 {
      font-size: 1.125rem;
      font-weight: 700;
    }

    .ph p {
      font-size: .8rem;
      color: var(--n500);
      margin-top: 2px;
    }

    .bsh {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: none;
      border: 1.5px solid var(--n300);
      border-radius: 8px;
      padding: .45rem .85rem;
      font-family: inherit;
      font-size: .8rem;
      font-weight: 500;
      color: var(--n600);
      cursor: pointer;
      transition: all var(--tr);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bsh:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .pw {
      background: #fff;
      border-radius: var(--rad);
      padding: .9rem 1rem;
      margin-bottom: 1rem;
      box-shadow: var(--sh2);
    }

    .pi2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .5rem;
    }

    .ptxt2 {
      font-size: .82rem;
      font-weight: 600;
      color: var(--n700);
    }

    .pans {
      font-size: .78rem;
      color: var(--n400);
    }

    .pbg {
      height: 6px;
      background: var(--n200);
      border-radius: 99px;
      overflow: hidden;
    }

    .pf {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width .3s ease;
    }

    .qcard {
      background: #fff;
      border-radius: var(--rad);
      box-shadow: var(--sh);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .qmeta {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .85rem;
    }

    .qn {
      background: var(--primary-light);
      color: var(--primary);
      font-size: .75rem;
      font-weight: 700;
      padding: .2rem .55rem;
      border-radius: 99px;
    }

    .qb {
      font-size: .7rem;
      font-weight: 600;
      padding: .2rem .5rem;
      border-radius: 99px;
    }

    .qb.mc {
      background: #ede9fe;
      color: #7c3aed;
    }

    .qb.tf {
      background: #fef9c3;
      color: #92400e;
    }

    .qtxt {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 1.1rem;
    }

    .arev {
      display: none;
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .875rem;
      color: var(--primary-dark);
      font-weight: 500;
      margin-bottom: 1rem;
      align-items: center;
      gap: .5rem;
    }

    .arev.show {
      display: flex;
    }

    .og {
      display: flex;
      flex-direction: column;
      gap: .65rem;
    }

    .ob {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--n200);
      border-radius: 9px;
      padding: .8rem 1rem;
      cursor: pointer;
      font-family: inherit;
      font-size: .9375rem;
      color: var(--n700);
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      transition: all var(--tr);
      line-height: 1.5;
    }

    .ob:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .ok {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border: 1.5px solid var(--n300);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .78rem;
      font-weight: 700;
      color: var(--n500);
      transition: all var(--tr);
    }

    .ob:hover:not(:disabled) .ok {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .ob.correct {
      border-color: var(--success);
      background: var(--success-light);
      color: var(--success);
    }

    .ob.correct .ok {
      border-color: var(--success);
      background: var(--success);
      color: #fff;
    }

    .ob.wrong {
      border-color: var(--danger);
      background: var(--danger-light);
      color: var(--danger);
    }

    .ob.wrong .ok {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
    }

    .ob.hc {
      border-color: var(--success);
      background: var(--success-light);
      color: var(--success);
    }

    .ob.hc .ok {
      border-color: var(--success);
      background: var(--success);
      color: #fff;
    }

    .ob:disabled {
      cursor: default;
    }

    .tg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
      margin-top: .25rem;
    }

    .tb {
      border: 1.5px solid var(--n200);
      border-radius: 9px;
      padding: 1rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
      transition: all var(--tr);
      background: #fff;
      color: var(--n600);
    }

    .tb:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .tbi {
      font-size: 1.5rem;
    }

    .tb.correct {
      border-color: var(--success);
      background: var(--success-light);
      color: var(--success);
    }

    .tb.wrong {
      border-color: var(--danger);
      background: var(--danger-light);
      color: var(--danger);
    }

    .tb.hc {
      border-color: var(--success);
      background: var(--success-light);
      color: var(--success);
    }

    .tb:disabled {
      cursor: default;
    }

    .fb {
      display: none;
      align-items: center;
      gap: .5rem;
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .875rem;
      font-weight: 600;
      margin-top: .85rem;
    }

    .fb.show {
      display: flex;
    }

    .fb.ok2 {
      background: var(--success-light);
      color: var(--success);
    }

    .fb.no {
      background: var(--danger-light);
      color: var(--danger);
    }

    .acbar {
      background: #fff;
      border-radius: var(--rad);
      box-shadow: var(--sh2);
      padding: .85rem 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .6rem 1.1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: .875rem;
      font-weight: 600;
      transition: all var(--tr);
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .bs2 {
      background: var(--n100);
      color: var(--n600);
      border: 1.5px solid var(--n200);
    }

    .bs2:hover:not(:disabled) {
      background: var(--n200);
    }

    .bp {
      background: var(--primary);
      color: #fff;
    }

    .bp:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .ba {
      background: var(--warning-light);
      color: var(--warning);
      border: 1.5px solid #fcd34d;
    }

    .ba:hover:not(:disabled) {
      background: #fde68a;
    }

    .bd {
      background: var(--success-light);
      color: var(--success);
      border: 1.5px solid #86efac;
      margin-left: auto;
    }

    .bd:hover:not(:disabled) {
      background: #bbf7d0;
    }

    .br {
      background: #fff0f0;
      color: #b91c1c;
      border: 1.5px solid #fca5a5;
    }

    .br:hover:not(:disabled) {
      background: #fee2e2;
    }

    .bpp {
      background: #f0f4ff;
      color: var(--primary);
      border: 1.5px solid #bfdbfe;
    }

    .bpp:hover:not(:disabled) {
      background: var(--primary-light);
    }

    .cel {
      display: none;
      background: var(--success-light);
      border: 1.5px solid #86efac;
      border-radius: var(--rad);
      padding: 1rem 1.25rem;
      text-align: center;
      margin-bottom: 1rem;
      animation: fi .4s ease;
    }

    .cel.show {
      display: block;
    }

    .cel h3 {
      color: var(--success);
      font-size: 1.1rem;
      margin-bottom: .25rem;
    }

    .cel p {
      color: var(--n600);
      font-size: .875rem;
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(-8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pu {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.04)
      }
    }

    .bd.pulse {
      animation: pu .6s ease;
    }

    @media(max-width:768px) {
      .mnu {
        display: flex;
        align-items: center;
        justify-content: center
      }

      .hsub {
        display: none
      }

      .sb {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 95;
        transform: translateX(-100%);
        transition: transform .25s ease
      }

      .sb.open {
        transform: translateX(0)
      }

      .sbo.show {
        display: block
      }

      main {
        padding: 1rem .75rem
      }

      .ph {
        flex-direction: column;
        gap: .5rem;
        align-items: flex-start
      }

      .acbar {
        gap: .45rem
      }

      .btn {
        padding: .55rem .85rem;
        font-size: .82rem
      }

      .bd {
        margin-left: 0;
        width: 100%;
        justify-content: center;
        margin-top: .35rem
      }

      .bpp,
      .br {
        width: 100%;
        justify-content: center
      }

      .qtxt {
        font-size: .975rem
      }
    }

    @media(max-width:380px) {
      .acbar {
        flex-direction: column
      }

      .btn {
        width: 100%;
        justify-content: center
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="hl">
      <button class="mnu" id="mnu">&#9776;</button>
      <div class="logo">Q</div>
      <div>
        <div class="htitle">Quiz &#212;n T&#7853;p</div>
        <div class="hsub">Qu&#7843;n L&yacute; D&#7921; &Aacute;n</div>
      </div>
    </div>
    <div class="hprog">
      <span id="otxt">0/7 ph&#7847;n</span>
      <div class="dots" id="dots"></div>
    </div>
  </header>
  <div class="sbo" id="sbo"></div>
  <div class="ab">
    <nav class="sb" id="sb">
      <div class="slbl">C&aacute;c ph&#7847;n &#244;n t&#7853;p</div>
      <ul class="plist" id="pl"></ul>
    </nav>
    <main>
      <div class="ph">
        <div>
          <h2 id="ptitle">Ph&#7847;n 1</h2>
          <p id="psub">C&acirc;u 1-20</p>
        </div>
        <button class="bsh" id="bsh">&#128256; X&aacute;o tr&#7897;n</button>
      </div>
      <div class="cel" id="cel">
        <h3>&#127881; B&#7841;n &#273;&atilde; ho&agrave;n th&agrave;nh ph&#7847;n n&agrave;y!</h3>
        <p id="celtxt">B&#7845;m &quot;&#272;&atilde; thu&#7897;c&quot; &#273;&#7875; m&#7903; kh&oacute;a ph&#7847;n
          ti&#7871;p theo.</p>
      </div>
      <div class="pw">
        <div class="pi2">
          <span class="ptxt2" id="ptxt">C&acirc;u 1 / 20</span>
          <span class="pans" id="pans">&#272;&atilde; tr&#7843; l&#7901;i: 0</span>
        </div>
        <div class="pbg">
          <div class="pf" id="pbar" style="width:0%"></div>
        </div>
      </div>
      <div class="qcard">
        <div class="qmeta">
          <span class="qn" id="qnum">C&acirc;u 1</span>
          <span class="qb" id="qbadge"></span>
        </div>
        <div class="qtxt" id="qtxt"></div>
        <div class="arev" id="arev"><span>&#128161;</span><span id="arevt"></span></div>
        <div id="opts"></div>
        <div class="fb" id="fb"></div>
      </div>
      <div class="acbar">
        <button class="btn bpp" id="bprevpart" style="display:none">&#9664;&#9664; Ph&#7847;n tr&#432;&#7899;c</button>
        <button class="btn bs2" id="bprev">&#9664; Quay l&#7841;i</button>
        <button class="btn ba" id="bans">&#128065; Xem &#273;&aacute;p &aacute;n</button>
        <button class="btn br" id="breset">&#128260; L&agrave;m l&#7841;i</button>
        <button class="btn bd" id="bdone">&#9989; &#272;&atilde; thu&#7897;c ph&#7847;n n&agrave;y</button>
        <button class="btn bp" id="bnext">Ti&#7871;p theo &#9654;</button>
      </div>
    </main>
  </div>
  <script>
    const DATA = {
      "title": "Ngân hàng câu hỏi ôn tập - Quản lý dự án",
      "total_questions": 131,
      "parts": [
        {
          "part": 1,
          "range": "1-20",
          "questions": [
            { "id": 1, "type": "multiple_choice", "question": "Cá nhân nào có vai trò quan trọng nhất đối với một dự án:", "options": { "a": "Giám đốc điều hành công ty", "b": "Khách hàng", "c": "Giám đốc quản lý dự án", "d": "Nhà tài trợ" }, "correct_answer": "c" },
            { "id": 2, "type": "multiple_choice", "question": "Các giai đoạn nghiên cứu hình thành dự án được thực hiện lần lượt:", "options": { "a": "Nghiên cứu tiền khả thi, nghiên cứu khả thi, nghiên cứu cơ hội đầu tư", "b": "Nghiên cứu cơ hội đầu tư, nghiên cứu tiền khả thi, nghiên cứu khả thi", "c": "Nghiên cứu cơ hội đầu tư, nghiên cứu khả thi, nghiên cứu tiền khả thi", "d": "Nghiên cứu khả thi, nghiên cứu cơ hội đầu tư, nghiên cứu tiền khả thi" }, "correct_answer": "b" },
            { "id": 3, "type": "true_false", "question": "Mục tiêu đầu tư dự án của tư nhân là tăng giá trị của chủ sở hữu và đem lại nhiều giá trị cho cộng đồng.", "correct_answer": "Sai" },
            { "id": 4, "type": "true_false", "question": "Sản phẩm của dự án có thể giống hoặc khác các sản phẩm của những dự án trước.", "correct_answer": "Đúng" },
